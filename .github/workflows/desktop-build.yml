# desktop アプリの 3OS ビルド検証 + バンドル生成。
# 手動発火 (workflow_dispatch) と desktop-v* タグ push で走る。
# macOS/Windows は実機を持っていないため、CI がビルド検証を兼ねる。
name: desktop-build

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]
  pull_request:
    paths:
      - "desktop/**"
      - "extension/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop-build.yml"

# checkout + artifact upload しかしないので最小権限に固定
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf libayatana-appindicator3-dev libxdo-dev libssl-dev

      - run: npm ci

      - run: npm run desktop:build

      - uses: actions/upload-artifact@v4
        with:
          name: claude-shift-desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
